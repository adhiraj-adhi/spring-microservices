server:
  port: 8081  # will remain same on all environments

spring:
  application:
    name: accounts  # will remain same on all environments
  # For now let us assume database related properties are same across all environments
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password: ''
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  profiles:
    active: qa  # setting qa as active profile
  config:
    import: "optional:configserver:http://localhost:8071"  # Importing configuration from config server
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true  # Enable circuit breaker for Feign clients
    stream:
      bindings:
        sendCommunication-out-0:
          destination: send-communication
            # Defines the logical broker destination where the accounts microservice will publish events.
            # In RabbitMQ, this typically maps to an Exchange.
            #
            # This destination name must match the destination configured by the consumer
            # microservice (messages service) so that both producer and consumer communicate
            # through the same RabbitMQ messaging channel.
  # Define RabbitMQ connection properties
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    connection-timeout: 10000ms

management:
  endpoints:
    web:
      exposure:
        include: "*"  # Exposing all actuator endpoints (we can expose specific endpoints in production for security reasons)
  endpoint:
    shutdown:
      enabled: true  # Enable shutdown endpoint
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true  # Enable environment info in actuator endpoints
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

eureka:
  client:
    register-with-eureka: true  # Enable registration with Eureka server
    fetch-registry: true  # Enable fetching registry information from Eureka server
    service-url:
      defaultZone: http://localhost:8070/eureka/  # Eureka server URL
  instance:
    prefer-ip-address: true  # Prefer IP address over hostname for service registration

info:
  app:
    name: accounts-service
    description: "XYZ Bank Accounts Application"
    version: 1.0.0

logging:
  level:
    com.microservice.accounts: DEBUG
  pattern:
    level: "%5p [${spring.application.name},%X{trace_id},%X{span_id}]"

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
  ratelimiter:
    configs:
      default:
        limitForPeriod: 1  # maximum number of requests allowed within a specific time window.
        limitRefreshPeriod: 5s # defines the "Window" of time. Every 5 seconds, the counter resets back to zero.
        timeoutDuration: 1s # maximum time to wait for permission to execute a request when the limit has been reached. If the timeout is exceeded, a RequestNotPermitted exception is thrown.