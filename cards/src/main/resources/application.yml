server:
  port: 9002
spring:
  application:
    name: cards
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password: ''
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  profiles:
    active: qa
  config:
    import: "optional:configserver:http://localhost:8071"
  rabbitmq:  # This is not required if we are using default RabbitMQ properties, but we are defining it here for clarity and future modifications
    host: localhost
    port: 5672
    username: guest
    password: guest

management:
  endpoints:
    web:
      exposure:
        include: "*"  # Exposing all actuator endpoints (we can expose specific endpoints in production for security reasons)