server:
  port: 8070

spring:
  application:
    name: eurekaserver
  config:
    import: "optional:configserver:http://localhost:8071"

managerment:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true