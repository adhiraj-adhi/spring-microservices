server:
  port: 8070

spring:
  application:
    name: eurekaserver
  config:
    import: "optional:configserver:http://localhost:8071"

management:  # It was typo - managerment
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{trace_id},%X{span_id}]"