# defining common-config start here:
x-network-deploy-service: &network-deploy-service
  networks:
    - XYZBank

x-microservice-base-config: &microservice-base-config
  deploy:
    resources:
      limits:
        memory: 700M

x-microservice-config: &microservice-config
  depends_on:
    configserver:
      condition: service_healthy
  environment:
    SPRING_CONFIG_IMPORT: "configserver:http://configserver:8071"
    SPRING_PROFILES_ACTIVE: "qa"
# defining common-config ends here

# our service definitions start here:
services:
  configserver:
    <<: [*network-deploy-service, *microservice-base-config] # will add both network
    # and base-config resource configuration to this service
    image: "abhinavyishu/configserver:v1.0"
    container_name: "configserver-ms"
    ports:
      - "8071:8071"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8071/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s


  accounts:
    <<: [*microservice-config, *microservice-base-config, *network-deploy-service]
    image: "abhinavyishu/accounts:v1.0"
    container_name: "accounts-ms"
    ports:
      - "8081:8081"

  loans:
    <<: [*microservice-config, *microservice-base-config, *network-deploy-service]
    image: "abhinavyishu/loans:v1.0"
    container_name: "loans-ms"
    ports:
      - "8091:8091"

  cards:
    <<: [*microservice-config, *microservice-base-config, *network-deploy-service]
    image: "abhinavyishu/cards:v1.0"
    container_name: "cards-ms"
    ports:
      - "9002:9002"

  # our service definitions end here, we can also add other services below in the
  # future if needed.

# defining the network
networks:
  XYZBank:
    driver: bridge